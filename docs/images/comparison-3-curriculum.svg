<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Broaden first. Then focus on Jacktol.</title><desc id="desc">Parakeet + Nemotron  •  General English remains in every stage</desc><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1200" height="590" rx="14" fill="#101410" stroke="#101410"/>
<path d="M40 40H96" stroke="#76B900" stroke-width="6"/>
<text x="114" y="48" fill="#76B900" font-size="18" font-weight="700">COMPARISON 3</text>
<text x="40" y="99" fill="#FFFFFF" font-size="36" font-weight="700">Broaden first. Then focus on Jacktol.</text>
<text x="40" y="135" fill="#BCC5BA" font-size="20" font-weight="400">Parakeet + Nemotron  •  General English remains in every stage</text>
<rect x="40" y="163" width="360" height="116" rx="14" fill="#20251F" stroke="#3C4735"/>
<text x="60" y="193" fill="#BCC5BA" font-size="17" font-weight="700">JACKTOL TRAINING</text>
<text x="60" y="231" fill="#76B900" font-size="30" font-weight="700">5.896 h</text>
<text x="60" y="259" fill="#BCC5BA" font-size="17" font-weight="400">Official training split</text>
<rect x="420" y="163" width="360" height="116" rx="14" fill="#20251F" stroke="#3C4735"/>
<text x="440" y="193" fill="#BCC5BA" font-size="17" font-weight="700">UWB ATC TRAINING</text>
<text x="440" y="231" fill="#76B900" font-size="30" font-weight="700">10.534 h</text>
<text x="440" y="259" fill="#BCC5BA" font-size="17" font-weight="400">Additional ATC speech</text>
<rect x="800" y="163" width="360" height="116" rx="14" fill="#20251F" stroke="#3C4735"/>
<text x="820" y="193" fill="#BCC5BA" font-size="17" font-weight="700">ENGLISH REPLAY</text>
<text x="820" y="231" fill="#76B900" font-size="30" font-weight="700">100.344 h</text>
<text x="820" y="259" fill="#BCC5BA" font-size="17" font-weight="400">LibriSpeech train-clean-100</text>
<rect x="40" y="308" width="520" height="190" rx="14" fill="#20251F" stroke="#3C4735"/>
<text x="62" y="344" fill="#FFFFFF" font-size="27" font-weight="700">A1 → A2 · Broad adaptation</text>
<text x="62" y="380" fill="#BCC5BA" font-size="23" font-weight="400">Jacktol + UWB + English</text>
<text x="62" y="417" fill="#76B900" font-size="23" font-weight="700">A1   30% / 30% / 40%</text>
<text x="62" y="455" fill="#76B900" font-size="23" font-weight="700">A2   40% / 35% / 25%</text>
<text x="573" y="413" fill="#76B900" font-size="31" font-weight="400">→</text>
<rect x="620" y="308" width="540" height="190" rx="14" fill="#20251F" stroke="#3C4735"/>
<text x="642" y="344" fill="#FFFFFF" font-size="25" font-weight="700">P1 → P2 → P3 · Focused refinement</text>
<text x="642" y="380" fill="#BCC5BA" font-size="22" font-weight="400">Jacktol + English · UWB removed</text>
<text x="642" y="417" fill="#76B900" font-size="22" font-weight="700">P1 80% / 20%  ·  P2 85% / 15%</text>
<text x="642" y="455" fill="#76B900" font-size="22" font-weight="700">P3   90% / 10%</text>
<text x="40" y="537" fill="#BCC5BA" font-size="20" font-weight="400">Pretrained base → A1 → A2 → P1 → P2 → P3; each stage uses the prior selected export.</text>
<text x="40" y="568" fill="#BCC5BA" font-size="19" font-weight="400">Hours = available training pools. Sampling changes across stages; pool sizes do not.</text>
</g></svg>