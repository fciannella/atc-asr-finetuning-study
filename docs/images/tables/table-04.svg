<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="542" viewBox="0 0 1800 542" role="img" aria-labelledby="title"><title id="title">Choose the ASR architecture</title><g font-family="Arial, Helvetica, sans-serif">
