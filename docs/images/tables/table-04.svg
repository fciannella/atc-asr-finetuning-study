<text x="324.00" y="289.0" font-size="24" font-weight="400" fill="#202A22">Predict frame-level tokens , then collapse blanks and repetitions</text>
<text x="1040.00" y="289.0" font-size="24" font-weight="400" fill="#202A22">Parallelizable decoding and convenient external-LM integration</text>
