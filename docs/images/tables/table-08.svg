<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="616" viewBox="0 0 1800 616" role="img" aria-labelledby="title"><title id="title">Four questions guide the experiments</title><g font-family="Arial, Helvetica, sans-serif">
