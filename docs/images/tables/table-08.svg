<rect x="48" y="244" width="1704" height="74" fill="#FFFFFF"/>
<text x="68.00" y="289.0" font-size="24" font-weight="700" fill="#202A22">1 · Label quality and replay</text>
<text x="528.00" y="289.0" font-size="24" font-weight="400" fill="#202A22">How should we use a small amount of trusted ATCO2 data?</text>
<text x="1346.00" y="289.0" font-size="24" font-weight="400" fill="#202A22">Parakeet + Nemotron</text>
<rect x="48" y="317" width="1704" height="1" fill="#CBD3C6"/>
<rect x="48" y="318" width="1704" height="74" fill="#F7F9F5"/>
<text x="68.00" y="363.0" font-size="24" font-weight="700" fill="#202A22">2 · Training duration</text>
<text x="528.00" y="363.0" font-size="24" font-weight="400" fill="#202A22">What happens if we keep training on Jacktol alone?</text>
<text x="1346.00" y="363.0" font-size="24" font-weight="400" fill="#202A22">Nemotron</text>
<rect x="48" y="391" width="1704" height="1" fill="#CBD3C6"/>
<rect x="48" y="392" width="1704" height="74" fill="#FFFFFF"/>
<text x="68.00" y="437.0" font-size="24" font-weight="700" fill="#202A22">3 · Training sequence</text>
<text x="528.00" y="437.0" font-size="22" font-weight="400" fill="#202A22">Can broad ATC training followed by focused refinement improve the balance?</text>
<text x="1346.00" y="437.0" font-size="24" font-weight="400" fill="#202A22">Parakeet + Nemotron</text>
<rect x="48" y="465" width="1704" height="1" fill="#CBD3C6"/>
<rect x="48" y="466" width="1704" height="74" fill="#F7F9F5"/>
<text x="68.00" y="511.0" font-size="24" font-weight="700" fill="#202A22">4 · Language-model decoding</text>
<text x="528.00" y="511.0" font-size="23" font-weight="400" fill="#202A22">Can training text improve the same checkpoints without acoustic retraining?</text>
<text x="1346.00" y="511.0" font-size="24" font-weight="400" fill="#202A22">Parakeet G3 / 42 + Nemotron P3</text>
<rect x="48" y="539" width="1704" height="1" fill="#CBD3C6"/>
